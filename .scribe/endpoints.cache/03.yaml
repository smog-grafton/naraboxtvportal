        content: '{"id":1,"slug":"stranger-things","title":"Stranger Things","description":"When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces, and one strange little girl.","thumbnail":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/posters\/tmdb_b8e9d22dd10e5fed9d0f33f3b59170d0.jpg","backdrop":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/backdrops\/tmdb_e2c04435d51353a3b20da52de687c500.jpg","rating":8.6,"releaseDate":"2016-07-15","category":"Series","mediaType":"SERIES","vj":null,"genre":["Mystery","Sci-Fi & Fantasy","Action & Adventure"],"trendingScore":0,"accessType":null,"is_free":false,"is_premium":true,"duration":"45m","priceRent":1000,"priceBuy":2000,"downloadEnabled":true,"seasons":[{"id":17,"number":1,"title":"Season 1","description":"Strange things are afoot in Hawkins, Indiana, where a young boy''s sudden disappearance unearths a young girl with otherworldly powers.","episodes":[{"id":329,"number":1,"title":"Chapter One: The Vanishing of Will Byers","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/uLES7sRpy7Ih6Kr6XCaYj1GyfTw.jpg","duration":"48m","description":"On his way home from a friend''s house, young Will sees something terrifying. Nearby, a sinister secret lurks in the depths of a government lab.","videoUrl":null},{"id":330,"number":2,"title":"Chapter Two: The Weirdo on Maple Street","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/8iA56ugQyHZmX81wSsNqwXjCE6F.jpg","duration":"55m","description":"Lucas, Mike and Dustin try to talk to the girl they found in the woods. Hopper questions an anxious Joyce about an unsettling phone call.","videoUrl":null},{"id":331,"number":3,"title":"Chapter Three: Holly, Jolly","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/5snULpWQWp7aqFto7UbRcEkEyyS.jpg","duration":"51m","description":"An increasingly concerned Nancy looks for Barb and finds out what Jonathan''s been up to. Joyce is convinced Will is trying to talk to her.","videoUrl":null},{"id":332,"number":4,"title":"Chapter Four: The Body","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/60wmC1e20HV8gu688GAhsWxqxPx.jpg","duration":"50m","description":"Refusing to believe Will is dead, Joyce tries to connect with her son. The boys give Eleven a makeover. Nancy and Jonathan form an unlikely alliance.","videoUrl":null},{"id":333,"number":5,"title":"Chapter Five: The Flea and the Acrobat","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/exT4NW9EdXG1qLZHKJnRpq3gh1H.jpg","duration":"52m","description":"Hopper breaks into the lab while Nancy and Jonathan confront the force that took Will. The boys ask Mr. Clarke how to travel to another dimension.","videoUrl":null},{"id":334,"number":6,"title":"Chapter Six: The Monster","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/lNS6qycyucewz3duTr1tf1LU688.jpg","duration":"46m","description":"A frantic Jonathan looks for Nancy in the darkness, but Steve''s looking for her, too. Hopper and Joyce uncover the truth about the lab''s experiments.","videoUrl":null},{"id":335,"number":7,"title":"Chapter Seven: The Bathtub","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/fjsTVEnqTKUO0GJSpiWKBZRUBcx.jpg","duration":"42m","description":"Eleven struggles to reach Will, while Lucas warns that \"the bad men are coming.\" Nancy and Jonathan show the police what Jonathan caught on camera.","videoUrl":null},{"id":336,"number":8,"title":"Chapter Eight: The Upside Down","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/1teJ5dbuepfqOOs9uYhYTUjr2qs.jpg","duration":"54m","description":"Dr. Brenner holds Hopper and Joyce for questioning while the boys wait with Eleven in the gym. Back at Will''s, Nancy and Jonathan prepare for battle.","videoUrl":null}]},{"id":18,"number":2,"title":"Stranger Things 2","description":"It''s been nearly a year since Will''s strange disappearance. But life''s hardly back to normal in Hawkins. Not even close.","episodes":[{"id":337,"number":1,"title":"Chapter One: MADMAX","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/efz0MgPAxPw11PIeAJNgKKg3Paa.jpg","duration":"48m","description":"As the town preps for Halloween, a high-scoring rival shakes things up at the arcade, and a skeptical Hopper inspects a field of rotting pumpkins.","videoUrl":null},{"id":338,"number":2,"title":"Chapter Two: Trick or Treat, Freak","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/3gzPnRilyASmcoSyUKXhaD5ofhr.jpg","duration":"56m","description":"After Will sees something terrible on trick-or-treat night, Mike wonders whether Eleven''s still out there. Nancy wrestles with the truth about Barb.","videoUrl":null},{"id":339,"number":3,"title":"Chapter Three: The Pollywog","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/792NQjFydcr5ucb1sga55LS6Vt3.jpg","duration":"51m","description":"Dustin adopts a strange new pet, and Eleven grows increasingly impatient. A well-meaning Bob urges Will to stand up to his fears.","videoUrl":null},{"id":340,"number":4,"title":"Chapter Four: Will the Wise","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/wZXeV5cWC1RuaCls2mm6imzchnN.jpg","duration":"46m","description":"An ailing Will opens up to Joyce -- with disturbing results. While Hopper digs for the truth, Eleven unearths a surprising discovery.","videoUrl":null},{"id":341,"number":5,"title":"Chapter Five: Dig Dug","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/oshY3LAwQRzhcjmEEr7EbOnypuU.jpg","duration":"58m","description":"Nancy and Jonathan swap conspiracy theories with a new ally as Eleven searches for someone from her past. \u201cBob the Brain\u201d tackles a difficult problem.","videoUrl":null},{"id":342,"number":6,"title":"Chapter Six: The Spy","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/d90nCiTEACFEUd3fcX8DrLBi5DL.jpg","duration":"52m","description":"Will''s connection to a shadowy evil grows stronger, but no one''s quite sure how to stop it. Elsewhere, Dustin and Steve forge an unlikely bond.","videoUrl":null},{"id":343,"number":7,"title":"Chapter Seven: The Lost Sister","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/kgOaaTbAutwAoA7tkVzYCfTjPXn.jpg","duration":"46m","description":"Psychic visions draw Eleven to a band of violent outcasts and an angry girl with a shadowy past.","videoUrl":null},{"id":344,"number":8,"title":"Chapter Eight: The Mind Flayer","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/vuLea0DA9rYc9Y4M2Ic28CXL4Al.jpg","duration":"48m","description":"An unlikely hero steps forward when a deadly development puts the Hawkins Lab on lockdown, trapping Will and several others inside.","videoUrl":null},{"id":345,"number":9,"title":"Chapter Nine: The Gate","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/cxCf7O5WPHfyXb7PLSJCG6EvXc3.jpg","duration":"1h 2m","description":"Eleven makes plans to finish what she started while the survivors turn up the heat on the monstrous force that''s holding Will hostage.","videoUrl":null}]},{"id":19,"number":3,"title":"Stranger Things 3","description":"Budding romance. A brand-new mall. And rabid rats running toward danger. It''s the summer of 1985 in Hawkins ... and one summer can change everything.","episodes":[{"id":346,"number":1,"title":"Chapter One: Suzie, Do You Copy?","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/g1iZmyn42qSFkXhw6gjoNE0diKb.jpg","duration":"51m","description":"Summer brings new jobs and budding romance. But the mood shifts when Dustin''s radio picks up a Russian broadcast, and Will senses something is wrong.","videoUrl":null},{"id":347,"number":2,"title":"Chapter Two: The Mall Rats","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/qDlMvdlRGzIGtKYdV9lktEUM4vj.jpg","duration":"51m","description":"Nancy and Jonathan follow a lead, Steve and Robin sign on to a secret mission, and Max and Eleven go shopping. A rattled Billy has troubling visions.","videoUrl":null},{"id":348,"number":3,"title":"Chapter Three: The Case of the Missing Lifeguard","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/oaYdVvYwnvoQ7SLelKUcaAt0HKJ.jpg","duration":"50m","description":"With El and Max looking for Billy, Will declares a day without girls. Steve and Dustin go on a stakeout, and Joyce and Hopper return to Hawkins Lab.","videoUrl":null},{"id":349,"number":4,"title":"Chapter Four: The Sauna Test","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/tEgd6fXKngAG8eC92dH7ey6Y4eA.jpg","duration":"53m","description":"A code red brings the gang back together to face a frighteningly familiar evil. Karen urges Nancy to keep digging, and Robin finds a useful map.","videoUrl":null},{"id":350,"number":5,"title":"Chapter Five: The Flayed","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/cxIZ4btU6h9GQM1Fn0kotuaXlwo.jpg","duration":"52m","description":"Strange surprises lurk inside an old farmhouse and deep beneath the Starcourt Mall. Meanwhile, the Mind Flayer is gathering strength.","videoUrl":null},{"id":351,"number":6,"title":"Chapter Six: E Pluribus Unum","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/dZKsMHJm8DPdBuqFcZxdIulrpNs.jpg","duration":"1h 0m","description":"Dr. Alexei reveals what the Russians have been building, and Eleven sees where Billy has been. Dustin and Erica stage a daring rescue.","videoUrl":null},{"id":352,"number":7,"title":"Chapter Seven: The Bite","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/6QA91GJK2ze1EaGPEKhil9MJIXx.jpg","duration":"56m","description":"With time running out -- and an assassin close behind -- Hopper''s crew races back to Hawkins, where El and the kids are preparing for war.","videoUrl":null},{"id":353,"number":8,"title":"Chapter Eight: The Battle of Starcourt","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/5YcjTWas07RteM9lssOzL9UhmJh.jpg","duration":"1h 18m","description":"Terror reigns in the food court when the Mind Flayer comes to collect. But down below, in the dark, the future of the world is at stake.","videoUrl":null}]},{"id":20,"number":4,"title":"Stranger Things 4","description":"Darkness returns to Hawkins just in time for spring break, igniting fresh terror, disturbing memories \u2014 and an ominous new threat.","episodes":[{"id":354,"number":1,"title":"Chapter One: The Hellfire Club","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/xeNKubDmPiMraW4hXqzEBrN6f4A.jpg","duration":"1h 19m","description":"El is bullied at school. Joyce opens a mysterious package. A scrappy player shakes up D&D night.","videoUrl":null},{"id":355,"number":2,"title":"Chapter Two: Vecna''s Curse","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/lSSWqv7XrO51uY2uc4lql9Hub3f.jpg","duration":"1h 18m","description":"A plane brings Mike to California \u2014 and a dead body brings Hawkins to a halt. Nancy goes looking for leads. A shaken Eddie tells the gang what he saw.","videoUrl":null},{"id":356,"number":3,"title":"Chapter Three: The Monster and the Superhero","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/6q1UM63T5tiQcWrbsJvY3bunkyZ.jpg","duration":"1h 4m","description":"Murray and Joyce fly to Alaska, and El faces serious consequences. Robin and Nancy dig up dirt on Hawkins'' demons. Dr. Owens delivers sobering news.","videoUrl":null},{"id":357,"number":4,"title":"Chapter Four: Dear Billy","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/u3LeFRR7AhyPp4y0Ii7hpkD488b.jpg","duration":"1h 19m","description":"Max is in grave danger... and running out of time. A patient at Pennhurst asylum has visitors. Elsewhere, in Russia, Hopper is hard at work.","videoUrl":null},{"id":358,"number":5,"title":"Chapter Five: The Nina Project","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/yvXXeBv4zfDgwcZyxqH5LJAe4oV.jpg","duration":"1h 15m","description":"Owens takes El to Nevada, where she''s forced to confront her past, while the Hawkins kids comb a crumbling house for clues. Vecna claims another victim.","videoUrl":null},{"id":359,"number":6,"title":"Chapter Six: The Dive","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/9EbhReDcbfmqLhDBg0Rn97z4lT.jpg","duration":"1h 14m","description":"Behind the Iron Curtain, a risky rescue mission gets underway. The California crew seeks help from a hacker. Steve takes one for the team.","videoUrl":null},{"id":360,"number":7,"title":"Chapter Seven: The Massacre at Hawkins Lab","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/n64hMYFaVunT8jqSVgYq5qt0Vbn.jpg","duration":"1h 40m","description":"As Hopper braces to battle a monster, Dustin dissects Vecna''s motives \u2014 and decodes a message from beyond. El finds strength in a distant memory.","videoUrl":null},{"id":361,"number":8,"title":"Chapter Eight: Papa","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/sdNa4Z49RTZDkezFAMg00hciFZZ.jpg","duration":"1h 26m","description":"Nancy has sobering visions, and El passes an important test. Back in Hawkins, the gang gathers supplies and prepares for battle.","videoUrl":null},{"id":362,"number":9,"title":"Chapter Nine: The Piggyback","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/fvoa0Hosu4yK7TUiHglV8TvjMUB.jpg","duration":"2h 23m","description":"With selfless hearts and a clash of metal, heroes fight from every corner of the battlefield to save Hawkins \u2014 and the world itself.","videoUrl":null}]},{"id":21,"number":5,"title":"Stranger Things 5","description":"The fall of 1987. Hawkins is scarred by rifts. Vecna has vanished and the government has placed the town under military quarantine, forcing Eleven back into hiding. To end this nightmare, they''ll need everyone together, one last time.","episodes":[{"id":363,"number":1,"title":"Chapter One: The Crawl","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/jnpSxSMdFAj4dtF59agzgmKM9fg.jpg","duration":"1h 12m","description":"November, 1987. The gang evades the military to scour the Upside Down for Vecna \u2014 but fails to notice a threat lurking closer to home.","videoUrl":null},{"id":364,"number":2,"title":"Chapter Two: The Vanishing of...","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/dI8N4IQpZNKloK4Dw6MugpSrwMS.jpg","duration":"58m","description":"After a vicious attack at the Wheeler home, Mike and Nancy confront the cost of secrecy, while El and Hopper embark on a rescue mission.","videoUrl":null},{"id":365,"number":3,"title":"Chapter Three: The Turnbow Trap","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/vBLzxoyZTbT0ImHXKWG2fe7j2om.jpg","duration":"1h 10m","description":"Will gains unique insight into Vecna''s next move, giving the crew an opportunity to set a trap. Holly explores her new surroundings.","videoUrl":null},{"id":366,"number":4,"title":"Chapter Four: Sorcerer","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/mp6nFiganZCbieJ0wSjIHz7bS8r.jpg","duration":"1h 27m","description":"The military tightens its grip on the town. Mike, Lucas and Robin orchestrate a daring escape. El comes face-to-face with the enemy.","videoUrl":null},{"id":367,"number":5,"title":"Chapter Five: Shock Jock","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/4dnRX3S1II3NGkrnwCFZkYpgK83.jpg","duration":"1h 8m","description":"The gang hatches an electrifying plan to reconnect Will to the hive mind. Tensions flare during a search of the Upside Down''s Hawkins Lab.","videoUrl":null},{"id":368,"number":6,"title":"Chapter Six: Escape from Camazotz","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/4joGuE1zoHIyGta2tlcSBI5XiV8.jpg","duration":"1h 16m","description":"As Holly and Max fight to escape Vecna''s mind, El must find a way into Will''s. Joyce wrestles with guilt. Jonathan and Nancy face a turning point.","videoUrl":null},{"id":369,"number":7,"title":"Chapter Seven: The Bridge","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/dJiUttONHE4jjEjPDEOU2hIQBWO.jpg","duration":"1h 6m","description":"On the anniversary of Will''s disappearance, the party reunites to prepare for a battle with world-altering implications.","videoUrl":null},{"id":370,"number":8,"title":"Chapter Eight: The Rightside Up","thumbnail":"https:\/\/image.tmdb.org\/t\/p\/w500\/kP23RWbUWM6vGhT9PxFyP5VT3y4.jpg","duration":"2h 9m","description":"As Vecna prepares to destroy the world as we know it, the party must put everything on the line to defeat him once and for all.","videoUrl":null}]}],"cast":[{"id":76,"name":"Millie Bobby Brown","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_d11fa16fc92e7d2d38c7bcc98bc45c12.jpg","role":"Actor"},{"id":77,"name":"Winona Ryder","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_0ea637a3afaf067d551155817619b800.jpg","role":"Actor"},{"id":78,"name":"David Harbour","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_aa47014f57653805580488d1bea5666a.jpg","role":"Actor"},{"id":79,"name":"Finn Wolfhard","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_e90f9df98183b8f53e4d55eab0ddfe52.jpg","role":"Actor"},{"id":80,"name":"Gaten Matarazzo","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_5c57d3372a77f036a6a867fbf72f6c10.jpg","role":"Actor"},{"id":81,"name":"Caleb McLaughlin","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_2ca79b257871c56a16cba3acf91f6b74.jpg","role":"Actor"},{"id":82,"name":"Noah Schnapp","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_3267efae461f1539ae11ae65aaf1748e.jpg","role":"Actor"},{"id":83,"name":"Sadie Sink","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_6402a1f20e68d274ba4a1bd1e6b26de1.jpg","role":"Actor"},{"id":84,"name":"Charlie Heaton","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_92ae32e506cd2527e95d0847d372bf50.jpg","role":"Actor"},{"id":85,"name":"Natalia Dyer","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_8e7a4486f7fcd19d455109f3d421111c.jpg","role":"Actor"},{"id":86,"name":"Joe Keery","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_3effa5927187ac83c18f9be1bb4aa608.jpg","role":"Actor"},{"id":87,"name":"Maya Hawke","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_9b81fbd6db7177ef8214d17dcb8e0a1b.jpg","role":"Actor"},{"id":88,"name":"Cara Buono","image":"http:\/\/127.0.0.1:8000\/storage\/tmdb\/actors\/tmdb_37ffad63fc52b119bcb71c9a4b3b0e91.jpg","role":"Actor"},{"id":89,"name":"Priah Ferguson","