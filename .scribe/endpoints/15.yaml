name: 'Access & Views'
description: |-

  Check access to content (free/subscription/rent/buy); track views.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/access/check
    metadata:
      custom: []
      groupName: 'Access & Views'
      groupDescription: |-

        Check access to content (free/subscription/rent/buy); track views.
      subgroup: ''
      subgroupDescription: ''
      title: 'Check if user has access to a movie or TV show'
      description: |-
        Frontend helper to decide whether to show **Play**, **Rent**, **Buy**, **Subscribe**, or a locked state.

        Rules:
        - Free content (`is_free = 1`) is always accessible (no auth required).
        - Premium content (`is_premium = 1`) requires an active subscription.
        - Paid content with `price_rent` / `price_buy` checks rentals and purchases.
        - Pending transactions are surfaced so the UI can show “Pending approval”.

        Returns a normalized `access_type`:
        - `FREE`
        - `SUBSCRIPTION`
        - `PREMIUM` (subscription required, but none active)
        - `PURCHASED`
        - `RENTED`
        - `PENDING`
        - `PAID` (payment required: rent and/or buy)
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-API-KEY: FMfcgzQfCMsttJHqsljxCcRXXfdTvGrN
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      media_id:
        custom: []
        name: media_id
        description: 'The `id` of the movie or TV show to check.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      media_type:
        custom: []
        name: media_type
        description: 'Must be `MOVIE` or `TV_SHOW`.'
        required: true
        example: MOVIE
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      media_id: 1
      media_type: MOVIE
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
           "has_access": true,
           "access_type": "FREE",
           "reason": "Content is free"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 200
        content: |-
          {
           "has_access": true,
           "access_type": "SUBSCRIPTION",
           "reason": "You have an active subscription",
           "subscription_expires_at": "2026-03-31T20:00:00+03:00"
          }
        headers: []
        description: 'Premium with active subscription'
      -
        custom: []
        status: 200
        content: |-
          {
           "has_access": false,
           "access_type": "PAID",
           "reason": "Payment required",
           "can_rent": true,
           "can_buy": true,
           "rent_price": 1000,
           "buy_price": 2200
          }
        headers: []
        description: 'Paid but not yet rented/bought'
      -
        custom: []
        status: 401
        content: |-
          {
           "has_access": false,
           "access_type": null,
           "reason": "Authentication required",
           "requires_auth": true
          }
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: |-
          {
           "error": "Media not found"
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/views/track
    metadata:
      custom: []
      groupName: 'Access & Views'
      groupDescription: |-

        Track play views. Body: media_id, media_type (MOVIE|TV_SHOW). Public.
      subgroup: ''
      subgroupDescription: ''
      title: 'Track a view. Body: media_id, media_type (MOVIE|TV_SHOW).'
      description: ''
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-API-KEY: FMfcgzQfCMsttJHqsljxCcRXXfdTvGrN
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      media_id:
        custom: []
        name: media_id
        description: ''
        required: true
        example: 16
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      media_type:
        custom: []
        name: media_type
        description: ''
        required: true
        example: MOVIE
        type: string
        enumValues:
          - MOVIE
          - TV_SHOW
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      media_id: 16
      media_type: MOVIE
    fileParameters: []
    responses: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
